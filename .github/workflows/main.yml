name: Build

on:
  push:
    branches: [ main, stable ]
  workflow_dispatch:

env:
  ZIG_VERSION: 0.12.0-dev.3192+e2cbbd0c2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
          lfs: true

      - uses: goto-bus-stop/setup-zig@v2.2.0
        with:
          version: ${{ env.ZIG_VERSION }}

      - run: sudo apt install --yes libsndfile1 libsndfile1-dev
      - run: zig build test
      - run: zig fmt --check src
